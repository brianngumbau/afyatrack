name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the container base image; 3.12 guards against
        # deprecations before they become a forced upgrade.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Lint with flake8
        run: python -m flake8 src tests app.py

      - name: Run unit tests
        run: python -m pytest --verbose

  container-build:
    name: Validate container image
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: afyatrack:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the shipped image can actually import and score the pipeline,
      # and that it does so without root privileges.
      - name: Verify image runs unprivileged and passes its own tests
        run: |
          test "$(docker run --rm afyatrack:ci id -u)" != "0"
          docker run --rm afyatrack:ci pytest --quiet
