[flake8]
max-line-length = 100
extend-exclude = venv,.venv,env,build,dist,.git,__pycache__,.pytest_cache
# E203 and W503 conflict with PEP 8's own slicing and line-break guidance and
# are disabled by convention in formatter-aligned projects.
extend-ignore = E203,W503
max-complexity = 12

[tool:pytest]
# Put the repository root on sys.path so `import src...` resolves without an
# editable install, keeping `make test` and CI identical to a bare `pytest`.
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
